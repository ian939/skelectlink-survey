<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>전기택시 충전 이용 실태 및 멤버십 수요 조사</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#1D1D1F;
  --paper:#FFFFFF;
  --bg:#F5F5F7;
  --red:#EA002C;
  --red-deep:#B80022;
  --red-soft:#FFF0F3;
  --line:#E4E5EA;
  --line-strong:#CDD1D8;
  --muted:#6E6E73;
  --muted-2:#98989E;
  --ok:#0F9D58;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --pad:20px;
  --r:16px;
  /* Apple 스프링 근사 이징 — 임계감쇠(overshoot 없음) */
  --ease-spring:cubic-bezier(.22,1,.36,1);
  --ease-sheet:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:22px;line-height:1.55;
  font-feature-settings:'tnum';
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  word-break:keep-all;overflow-wrap:break-word;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ── 앱 프레임 ───────────────────────────── */
#app{
  max-width:520px;margin:0 auto;min-height:100%;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;
}

/* ── 배터리 게이지 (시그니처 · 반투명 크롬) ── */
#topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(245,245,247,.72);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 11px;
}
.gauge-row{display:flex;align-items:center;gap:10px}
.battery{
  position:relative;flex:1;height:11px;
  border:1.5px solid var(--line-strong);border-radius:4px;
  background:#fff;overflow:hidden;
}
.battery::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(100%/25 - 1px),rgba(0,0,0,.10) calc(100%/25 - 1px) calc(100%/25));
}
.battery .fill{
  height:100%;width:0;border-radius:2px 0 0 2px;
  background:linear-gradient(180deg,#FF2A4E,var(--red) 55%,var(--red-deep));
  transition:width .45s var(--ease-spring);
}
.nub{width:3px;height:6px;border-radius:0 2px 2px 0;background:var(--line-strong);margin-left:-8px}
.pct{font-size:15.5px;font-weight:700;color:var(--red);min-width:38px;text-align:right;letter-spacing:.01em}
.gauge-meta{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:7px;font-size:15.5px;letter-spacing:.01em;color:var(--muted-2);font-weight:600;
}

/* ── 스테이지 ────────────────────────────── */
#stage{flex:1;padding:24px var(--pad) 0;display:flex;flex-direction:column}
.screen{animation:enter .3s var(--ease-spring) both}
.screen.back{animation:enterBack .3s var(--ease-spring) both}
.screen.still{animation:none}
@keyframes enter{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes enterBack{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}

.qnum{
  font-size:17px;font-weight:700;letter-spacing:.02em;
  color:var(--muted-2);margin-bottom:8px;
}
.qnum b{color:var(--red);font-weight:700}
h1.q{
  font-size:30px;line-height:1.36;font-weight:700;letter-spacing:-.02em;
  margin:0 0 8px;word-break:keep-all;
}
.hint{font-size:19px;color:var(--muted);margin:0 0 20px;word-break:keep-all;line-height:1.5}

/* ── 선택지 ─────────────────────────────── */
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:66px;padding:15px 16px;
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
  font-size:21.5px;font-weight:500;line-height:1.4;word-break:keep-all;
  transition:border-color .15s ease,background .15s ease,transform .1s ease-out;
}
.opt:active{transform:scale(.975)}
.opt .mark{
  flex:0 0 26px;width:26px;height:26px;border:1.7px solid var(--line-strong);
  display:grid;place-items:center;font-size:14.5px;font-weight:700;
  color:transparent;background:#fff;transition:all .15s ease;
}
.opt .mark.round{border-radius:50%}
.opt .mark.square{border-radius:7px}
.opt .sub{display:block;font-size:17px;color:var(--muted);font-weight:500;margin-top:2px}
.opt.on{border-color:var(--red);background:var(--red-soft)}
.opt.on .mark{background:var(--red);border-color:var(--red);color:#fff}
.opt.on .mark.round::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.opt.dim{opacity:.42}

/* 순위 뱃지 */
.opt .rank,.card .rank{
  flex:0 0 30px;width:30px;height:30px;border-radius:50%;
  border:1.7px solid var(--line-strong);background:#fff;
  display:grid;place-items:center;
  font-size:17px;font-weight:700;color:var(--muted-2);
  transition:all .18s var(--ease-spring);
}
.opt.on .rank,.card.on .rank{background:var(--red);border-color:var(--red);color:#fff;transform:scale(1.08)}

/* 기타 입력 */
.other-wrap{padding:0 15px 13px;margin-top:-4px}
.other-in{
  width:100%;height:54px;padding:0 14px;background:#fff;
  border:1.5px solid var(--red);border-radius:11px;font-size:21px;
}
.other-in:focus{outline:2px solid rgba(234,0,44,.18);outline-offset:1px}

/* ── 척도 ───────────────────────────────── */
.scale{display:flex;flex-direction:column;gap:9px}
.scale .opt{min-height:68px}
.scale .num{
  flex:0 0 36px;width:36px;height:36px;border-radius:50%;
  background:#F0F0F3;color:var(--muted);
  display:grid;place-items:center;font-weight:700;font-size:19.5px;
  transition:all .15s ease;
}
.scale .opt.on .num{background:var(--red);color:#fff}

/* ── 급속/완속 비중 슬라이더 ─────────────── */
.ratio{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:20px 18px 10px}
.ratio .vals{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:4px}
.ratio .side{display:flex;flex-direction:column;gap:2px}
.ratio .side.right{text-align:right}
.ratio .vlab{font-size:23px;font-weight:700;color:var(--muted)}
.ratio .vnum{font-size:41.5px;font-weight:800;letter-spacing:-.02em;color:var(--muted-2)}
.ratio .vnum.fast{color:var(--red)}
input[type=range].rt{
  -webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;
}
input[type=range].rt::-webkit-slider-runnable-track{
  height:12px;border-radius:6px;
  background:linear-gradient(90deg,var(--red) calc(var(--p)*1%),#E9E9EC calc(var(--p)*1%));
}
input[type=range].rt::-webkit-slider-thumb{
  -webkit-appearance:none;width:30px;height:30px;border-radius:50%;margin-top:-9px;
  background:#fff;border:1.5px solid var(--line-strong);
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
input[type=range].rt::-moz-range-track{height:12px;border-radius:6px;background:#E9E9EC}
input[type=range].rt::-moz-range-progress{height:12px;border-radius:6px;background:var(--red)}
input[type=range].rt::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:1.5px solid var(--line-strong);box-shadow:0 2px 8px rgba(0,0,0,.18)}

/* ── 맞춤 할인액 패널 ────────────────────── */
.savebox{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
  padding:20px 18px;text-align:center;margin:0 0 18px;
}
.savebox .sv-lab{font-size:17px;font-weight:700;color:var(--muted);margin-bottom:6px}
.savebox .sv-num{font-size:49.5px;font-weight:800;color:var(--red);letter-spacing:-.03em;line-height:1.2}
.savebox .sv-num small{font-size:26px;font-weight:700}
.savebox .sv-formula{font-size:17px;color:var(--muted-2);margin-top:8px}
.savebox .sv-note{
  margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:17.5px;font-weight:600;color:var(--ink);
}

/* ── 1순위 표시 ──────────────────────────── */
.toppick{
  display:flex;flex-direction:column;gap:3px;
  background:var(--red-soft);border:1.5px solid #F6C9D1;border-radius:var(--r);
  padding:13px 16px;margin:0 0 16px;
}
.toppick .tp-lab{font-size:15.5px;font-weight:700;color:var(--red);letter-spacing:.02em}
.toppick .tp-name{font-size:21.5px;font-weight:700}
.toppick .tp-price{font-size:17px;font-weight:700;color:var(--red);margin-left:4px}

/* ── 충전량별 절감액 표 ──────────────────── */
.savetbl{
  margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);
  text-align:left;
}
.savetbl .st-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:10px}
.savetbl .st-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:8px 6px;font-size:18px;
}
.savetbl .st-row+.st-row{border-top:1px solid #F2F2F5}
.savetbl .st-kwh{color:var(--muted);font-weight:600}
.savetbl .st-won{font-weight:700;color:var(--red)}
.savetbl .st-note{font-size:15px;color:var(--muted-2);text-align:center;margin-top:10px}

/* ── 프로모 이미지 ───────────────────────── */
.promo-img{margin:-28px -22px 20px;border-bottom:1px solid var(--line)}
.promo-img img{display:block;width:100%;height:auto}

/* ── 숫자 / 텍스트 입력 ──────────────────── */
.numbox{
  display:flex;align-items:center;gap:10px;
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
  padding:6px 16px;transition:border-color .15s ease;
}
.numbox:focus-within{border-color:var(--red)}
.numbox input{
  flex:1;min-width:0;border:none;background:none;outline:none;
  height:60px;font-size:36.5px;font-weight:700;letter-spacing:-.015em;
}
.numbox input::placeholder{color:#D4D6DB;font-weight:600}
.numbox .unit{font-size:19.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.helper{font-size:17.5px;color:var(--muted-2);margin-top:10px;word-break:keep-all}

textarea.free{
  width:100%;min-height:180px;padding:16px;resize:none;
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
  font-size:21.5px;line-height:1.6;outline:none;transition:border-color .15s ease;
}
textarea.free:focus{border-color:var(--red)}

/* ── 드롭다운 ───────────────────────────── */
.sel-group{display:flex;flex-direction:column;gap:11px}
.sel-row{display:flex;align-items:center;gap:11px}
.sel-lab{
  flex:0 0 44px;font-size:16px;font-weight:700;
  color:var(--muted);letter-spacing:.01em;
}
.sel-wrap{position:relative;flex:1}
.sel-wrap select{
  appearance:none;-webkit-appearance:none;width:100%;height:62px;
  padding:0 40px 0 15px;background:var(--paper);
  border:1.5px solid var(--line);border-radius:var(--r);
  font-size:21px;font-weight:500;outline:none;transition:border-color .15s ease;
}
.sel-wrap select:focus{border-color:var(--red)}
.sel-wrap.filled select{border-color:var(--red);background:var(--red-soft)}
.sel-wrap::after{
  content:'';position:absolute;right:16px;top:50%;width:8px;height:8px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:translateY(-70%) rotate(45deg);pointer-events:none;
}
.mapfig{margin:0 0 18px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.mapfig img{display:block;width:100%;height:auto}
.mapfig figcaption{font-size:16px;color:var(--muted);padding:9px 13px;border-top:1px solid var(--line);background:#FAFAFC}

/* ── 컨셉 카드 ──────────────────────────── */
.cards{display:flex;flex-direction:column;gap:11px}
.card{
  display:flex;gap:13px;width:100%;text-align:left;padding:16px;
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
  transition:border-color .15s ease,background .15s ease,transform .1s ease-out;
}
.card:active{transform:scale(.985)}
.card.on{border-color:var(--red);background:var(--red-soft)}
.card .rank{flex:0 0 30px;width:30px;height:30px;margin-top:2px}
.card .body{flex:1;min-width:0}
.card .cname{font-size:22px;font-weight:700;letter-spacing:-.012em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .price{
  font-size:16px;font-weight:700;color:var(--red);letter-spacing:0;
  background:#fff;border:1px solid #F6C9D1;border-radius:6px;padding:1px 7px;
}
.card.on .price{background:#fff}
.card .cdesc{font-size:18px;color:var(--muted);line-height:1.5;margin-top:6px;word-break:keep-all}

/* ── 상품 안내 인터스티셜 ────────────────── */
.promo{
  background:var(--paper);border:1.5px solid var(--line);border-radius:20px;
  padding:28px 22px;text-align:center;overflow:hidden;position:relative;
  box-shadow:0 8px 28px rgba(0,0,0,.05);
}
.promo .brand{
  font-size:15.5px;font-weight:700;letter-spacing:.08em;color:var(--red);margin-bottom:18px;
}
.promo .lead{font-size:21px;color:var(--muted);word-break:keep-all;line-height:1.55}
.priceflow{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin:22px 0 6px;
}
.priceflow .was{font-size:34px;font-weight:600;color:var(--muted-2);text-decoration:line-through;text-decoration-thickness:2px}
.priceflow .arw{font-size:24.5px;color:var(--line-strong)}
.priceflow .now{font-size:57px;font-weight:800;color:var(--red);letter-spacing:-.03em}
.promo .save{
  display:inline-block;margin-top:4px;font-size:17.5px;font-weight:700;color:var(--red);
  background:var(--red-soft);border-radius:99px;padding:5px 13px;
}
.promo .note{font-size:19px;color:var(--ink);font-weight:600;margin-top:20px;word-break:keep-all}
.promo .unl{
  margin-top:14px;padding-top:16px;border-top:1px dashed var(--line);
  font-size:17.5px;color:var(--muted);word-break:keep-all;
}

/* ── 인트로 ─────────────────────────────── */
.hero{padding:0 0 4px}
.hero-img{
  margin:0 0 20px;border-radius:20px;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.10);
  border:1px solid rgba(0,0,0,.05);
}
.hero-img img{display:block;width:100%;height:auto}
.hero .kicker{
  display:inline-block;font-size:16px;font-weight:700;letter-spacing:.02em;
  color:var(--red);background:var(--red-soft);border-radius:99px;
  padding:5px 13px;margin-bottom:14px;
}
.hero h1{font-size:31px;line-height:1.4;font-weight:800;letter-spacing:-.022em;margin:0 0 12px;word-break:keep-all}
.hero p{font-size:20px;color:var(--muted);line-height:1.65;word-break:keep-all;margin:0 0 20px}

.event{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
  padding:6px 16px;margin-bottom:14px;
}
.ev{display:flex;gap:11px;padding:12px 0;font-size:19px;line-height:1.55;word-break:keep-all}
.ev+.ev{border-top:1px solid var(--line)}
.ev .ico{flex:0 0 22px;text-align:center;font-size:21px;line-height:1.45}
.ev .txt{flex:1;font-weight:500}
.ev .txt b{color:var(--red);font-weight:700}
.ev .txt .lab{font-weight:700;color:var(--ink)}

/* ── 개인정보 동의 (인트로) ───────────────── */
.consent{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
  padding:18px 16px 8px;margin-bottom:14px;
}
.consent .ct-head{font-size:21.5px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.consent .ct-head .req{margin-left:6px}
.consent .ct-sub{font-size:17px;color:var(--muted);margin-bottom:14px;word-break:keep-all}
.ptable{
  background:#F7F7F9;border-radius:12px;padding:4px 14px;margin-bottom:8px;
}
.prow{display:flex;gap:12px;padding:10px 0;font-size:17.5px;line-height:1.5;word-break:keep-all}
.prow+.prow{border-top:1px solid #ECECF0}
.prow .pk{flex:0 0 96px;color:var(--muted);font-weight:600}
.prow .pv{flex:1;font-weight:700}
.prow .pv.warn{color:var(--red)}
.chk{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-size:19px;font-weight:600;min-height:58px;padding:2px 0;word-break:keep-all}
.chk .box{
  flex:0 0 26px;width:26px;height:26px;border-radius:8px;border:1.7px solid var(--line-strong);
  background:#fff;display:grid;place-items:center;color:transparent;font-size:15.5px;font-weight:800;
  transition:all .15s ease;
}
.chk.on .box{background:var(--red);border-color:var(--red);color:#fff}
.req{color:var(--red);font-size:15.5px;font-weight:700}
.optlab{color:var(--muted-2);font-size:15.5px;font-weight:600}

.phonebox{margin-bottom:6px}
.phonebox .ph-lab{font-size:18px;font-weight:700;margin-bottom:8px}
.phonebox .ph-lab .req{margin-left:5px}

/* ── 완료 ───────────────────────────────── */
.done{text-align:center;padding:22px 0 0}
.bigbat{
  width:132px;height:58px;margin:0 auto 26px;position:relative;
  border:3px solid var(--red);border-radius:10px;background:#fff;
}
.bigbat::before{
  content:'';position:absolute;right:-11px;top:50%;transform:translateY(-50%);
  width:8px;height:22px;border-radius:0 4px 4px 0;background:var(--red);
}
.bigbat .bf{
  position:absolute;inset:4px;width:0;border-radius:5px;
  background:linear-gradient(180deg,#FF2A4E,var(--red) 55%,var(--red-deep));
  transition:width 1.15s var(--ease-spring);
}
.bigbat .bt{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:24.5px;font-weight:800;color:var(--ink);mix-blend-mode:difference;filter:invert(1);
}
.done h1{font-size:34px;font-weight:800;letter-spacing:-.023em;margin:0 0 12px}
.done p{font-size:20px;color:var(--muted);line-height:1.65;word-break:keep-all;margin:0 0 18px}
.done .payinfo{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
  padding:16px;font-size:18px;color:var(--muted);line-height:1.6;word-break:keep-all;text-align:left;
}
.done .payinfo b{color:var(--ink)}

/* ── 하단 액션바 (반투명 크롬) ─────────────── */
#actions{
  position:sticky;bottom:0;z-index:30;
  background:linear-gradient(180deg,rgba(245,245,247,0),var(--bg) 30%);
  padding:22px var(--pad) calc(env(safe-area-inset-bottom) + 16px);
  display:flex;gap:10px;align-items:stretch;
}
.btn{
  height:64px;border-radius:var(--r);font-size:22px;font-weight:700;letter-spacing:-.01em;
  display:grid;place-items:center;
  transition:opacity .15s ease,transform .1s ease-out,background .15s ease;
}
.btn:active{transform:scale(.975)}
.btn-back{
  flex:0 0 64px;background:var(--paper);border:1.5px solid var(--line);color:var(--muted);
  font-size:26px;
}
.btn-next{flex:1;background:var(--red);color:#fff;box-shadow:0 2px 12px rgba(234,0,44,.25)}
.btn-next[disabled]{background:#D9DBE0;color:#fff;box-shadow:none;cursor:default;transform:none}
.btn-ghost{
  flex:0 0 auto;padding:0 18px;background:transparent;color:var(--muted);
  font-size:19.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;
}

const TOTAL = Q.filter(x => x.n).length;
// 각 화면 시점에 '완료된' 문항 수
const DONE_AT = (() => { let c = 0; return Q.map(x => { const v = c; if (x.n) c++; return x.type === 'done' ? TOTAL : v; }); })();

/* ── 상태 ─────────────────────────────────────────────────── */
const A = {};            // 답변
const OTHER = {};        // 기타 입력값
let idx = 0, back = false;
const started = new Date();
let startedSurvey = null;   // '동의하고 설문 시작하기' 클릭 시각 — 진정성 판단용 참여시간 측정

const stage = document.getElementById('stage');
const actions = document.getElementById('actions');
const topbar = document.getElementById('topbar');

const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const label = o => typeof o === 'string' ? o : o.t;
// 문자열 옵션에서 o.sub 를 읽으면 String.prototype.sub(내장 함수)가 잡히므로 반드시 이 헬퍼를 쓸 것
const subOf = o => (typeof o === 'object' && o.sub) ? o.sub : '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function visible(i){ const q = Q[i]; return !q.when || q.when(A); }
function step(dir){
  let i = idx + dir;
  while (i > 0 && i < Q.length - 1 && !visible(i)) i += dir;
  return i;
}
function go(dir){ back = dir < 0; idx = step(dir); render(); window.scrollTo(0,0); }

/* ── 진행률 ───────────────────────────────────────────────── */
function progress(){
  const q = Q[idx];
  if (q.type === 'intro'){ topbar.hidden = true; return; }
  topbar.hidden = false;
  const done = DONE_AT[idx];
  const p = Math.round(done / TOTAL * 100);
  document.getElementById('fill').style.width = p + '%';
  document.getElementById('pct').textContent = p + '%';
  document.getElementById('counter').textContent = `${done} / ${TOTAL}`;
  document.getElementById('secLabel').textContent = q.s ? SEC[q.s] : '완료';
}

/* ── 렌더 ─────────────────────────────────────────────────── */
let lastRendered = -1;   // 같은 화면을 다시 그릴 때는 입장 애니메이션을 생략
function render(){
  const q = Q[idx];
  stage.innerHTML = ''; actions.innerHTML = '';
  const sc = el('div', idx === lastRendered ? 'screen still' : 'screen' + (back ? ' back' : ''));
  lastRendered = idx;

  if (q.n || q.nl){   // nl: 번호 카운트에 넣지 않는 보조 문항 (예: 19-1)
    sc.append(el('div','qnum',`<b>${q.n || q.nl}</b> / ${TOTAL} · ${SEC[q.s]}`));
    sc.append(el('h1','q',esc(q.q)));
    if (q.hint) sc.append(el('p','hint',esc(q.hint)));
    if (q.panel) sc.append(PANELS[q.panel]());
  }

  ({intro:rIntro, single:rSingle, multi:rMulti, rank:rRank, cards:rCards,
    region:rRegion, number:rNumber, scale:rScale, text:rText, ratio:rRatio,
    promo:rPromo, confirm:rConfirm, done:rDone })[q.type](q, sc);

  stage.append(sc);
  progress();
}

/* ── 하단 버튼 ────────────────────────────────────────────── */
function bar({next='다음', onNext, valid=true, skip=false, onSkip, hideBack=false} = {}){
  actions.innerHTML = '';
  if (!hideBack){
    const b = el('button','btn btn-back','&#8592;');
    b.setAttribute('aria-label','이전 문항');
    b.onclick = () => go(-1);
    actions.append(b);
  }
  if (skip){
    const s = el('button','btn btn-ghost','건너뛰기');
    s.onclick = onSkip || (() => go(1));
    actions.append(s);
  }
  const n = el('button','btn btn-next',next);
  n.disabled = !valid;
  n.onclick = onNext || (() => go(1));
  actions.append(n);
  return n;
}

/* ── 맞춤 예상 할인액 · 1순위 표시 패널 ───────────────────── */
// 예상 할인액 = 월 충전량 × 급속 비중 × 96원 (멤버십 급속 단가 391→295원, kWh당 96원 할인)
// 충전량은 Q8 구간 중간값을 쓰고, '모르겠다'면 Q3 일 주행거리 중간값 × 월 26일 ÷ 전비 5km/kWh 로 추정
function calcSave(){
  const KWH_MID = [400, 750, 1250, 1750, 2200, null];
  let kwh = A.q8 ? KWH_MID[A.q8 - 1] : null;
  let basis = '월 충전량';
  if (kwh == null){
    const KM_MID = [120, 200, 300, 400];
    const daily = A.q3 ? KM_MID[A.q3 - 1] : 250;
    kwh = Math.round(daily * 26 / 5);
    basis = '주행거리로 추정한 월 충전량';
  }
  const pct = A.q5 != null ? A.q5 : 50;
  const save = Math.round(kwh * (pct / 100) * 96 / 1000) * 1000;
  return { kwh, pct, save, basis };
}
const PANELS = {
  save(){
    const c = calcSave();
    const gain = c.save - 19900;
    const note = gain > 0
      ? `월 구독료 19,900원을 빼도 매달 약 ${gain.toLocaleString('ko-KR')}원 이득입니다.`
      : `월 구독료는 19,900원입니다. 할인액과 한번 비교해 보세요.`;
    return el('div','savebox',`
      <div class="sv-lab">기사님 맞춤 · 월 예상 할인액</div>
      <div class="sv-num">약 ${c.save.toLocaleString('ko-KR')}<small>원</small></div>

      <div class="sv-note">${note}</div>`);

  top1(){

  bar({ next:'설문 제출하기', onNext:submit, valid: ok() });
}

/* ── 화면: 완료 ───────────────────────────────────────────── */
function rDone(q, sc){
  const d = el('div','done');
  d.innerHTML = `
    <div class="bigbat"><div class="bf" id="bf"></div><div class="bt">100%</div></div>
    <h1>충전 완료!</h1>
    <p>끝까지 응답해 주셔서 감사합니다.<br>소중한 의견을 토대로 기사님들께 실제로 도움이 되는<br>멤버십을 만들어 다시 찾아뵙겠습니다.</p>
    <div class="payinfo"><b>선택하신 혜택은 이렇게 지급됩니다.</b><br>26년 8월 14일 이내, 남겨주신 휴대전화번호로 안내 문자를 보내드립니다. 5,000 포인트는 프로모션 코드를 SK일렉링크 App에 등록하시면 충전 시 바로 사용하실 수 있고, CV마스터 1달 무료는 가입 후 19,900 포인트로 환급받으실 수 있습니다.</div>
    <div class="sendstat" id="sendstat"></div>`;
  sc.append(d);
  setTimeout(() => { const f = document.getElementById('bf'); if (f) f.style.width = 'calc(100% - 8px)'; }, 220);
  actions.innerHTML = '';
}

/* ── 제출 ─────────────────────────────────────────────────── */
function payload(){
  const out = {
    submittedAt: new Date().toISOString(),
    durationSec: Math.round((Date.now() - started) / 1000),
    phone: A.phone || '',
    reward: A.reward || '',
    agreePrivacy: !!A.agreePrivacy,
    agreeMarketing: !!A.agreeMarketing
  };
  Q.filter(x => x.n || x.nl).forEach(q => {
    const v = A[q.id];
    const txt = o => typeof o === 'string' ? o : (o.t || '');
    if (q.type === 'single'){
      const o = v ? q.o[v-1] : null;
      out[q.id] = o ? (o.other ? `기타: ${OTHER[q.id]||''}` : txt(o)) : '';
      out[q.id + '_code'] = v || '';
      if (o && o.numeric) out[q.id + '_value'] = OTHER[q.id] || '';
    } else if (q.type === 'multi'){
      const arr = (v || []).map(i => { const o = q.o[i-1]; return o.other ? `기타: ${OTHER[q.id]||''}` : txt(o); });
      out[q.id] = arr.join(' | ');
      out[q.id + '_code'] = (v || []).join(',');
    } else if (q.type === 'rank' || q.type === 'cards' || q.type === 'region'){
      const arr = (v || []).filter(Boolean);
      arr.forEach((i, k) => {
        const o = q.o[i-1];
        out[`${q.id}_r${k+1}`] = q.type === 'cards' ? `${o.k}. ${o.t}` : (o.other ? `기타: ${OTHER[q.id]||''}` : txt(o));
      });
      for (let k = arr.length; k < (q.max || 3); k++) out[`${q.id}_r${k+1}`] = '';
      out[q.id + '_code'] = arr.join(',');
    } else if (q.type === 'scale'){
      out[q.id] = v || '';
      out[q.id + '_label'] = v ? q.o[v-1] : '';
    } else if (q.type === 'ratio'){
      out[q.id] = v == null ? '' : `급속 ${v} : 완속 ${100 - v}`;
      out[q.id + '_code'] = v == null ? '' : v;
    } else {
      out[q.id] = v == null ? '' : v;
    }
  });
  // 참여시간(설문 시작 클릭 → 제출) — 새 키라서 시트 헤더 맨 뒤에 열로 추가됨
  const t = startedSurvey ? Math.round((Date.now() - startedSurvey) / 1000) : '';
  out['참여시간_초'] = t;
  out['참여시간'] = t === '' ? '' : `${Math.floor(t / 60)}분 ${t % 60}초`;
  return out;
}

async function submit(){
  idx = Q.length - 1; back = false; render();
  window.scrollTo(0,0);
  const data = payload();
  const stat = document.getElementById('sendstat');
  if (!ENDPOINT){
    stat.textContent = '응답 수집 서버가 아직 연결되지 않았습니다. 아래 버튼으로 응답을 복사해 전달해 주세요.';
    const cp = el('button','btn btn-next','응답 내용 복사하기');
    cp.style.cssText = 'margin:14px auto 0;width:100%';
    cp.onclick = () => { navigator.clipboard.writeText(JSON.stringify(data, null, 2)); cp.textContent = '복사했습니다'; };
    stat.after(cp);
    return;
  }
  stat.textContent = '응답을 저장하는 중입니다…';
  try {
    await fetch(ENDPOINT, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(data)
    });
    stat.className = 'sendstat ok';
    stat.textContent = '응답이 정상적으로 저장되었습니다.';
  } catch (e){
    stat.className = 'sendstat err';
    stat.textContent = '저장에 실패했습니다. 화면을 닫지 마시고 조사원에게 알려주세요.';
  }
}

render();
</script>
